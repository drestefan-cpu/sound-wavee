# Runs PLAI's automatic checks on every push to main and every pull request:
# type check, unit tests, a production build, and browser checks of the main pages.
# (Database checks need Supabase access, so they're run by hand: npm run test:db)
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Unit tests
        run: npx vitest run
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser checks (builds the app first)
        run: npx playwright test
      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
